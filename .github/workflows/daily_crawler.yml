name: News Crawler to GAS

on:
  workflow_dispatch:  # 允許手動執行
  # schedule:
  #   - cron: '0 * * * *' # 如需每小時執行，取消此行註解

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install pandas requests lxml

      - name: Run Crawler
        env:
          # 將 GitHub Secret 轉為環境變數供 Python 使用
          GAS_URL: ${{ secrets.GAS_URL }}
        run: python github_crawler_script.py
