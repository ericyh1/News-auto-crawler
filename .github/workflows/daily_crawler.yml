name: Hourly News Crawler

on:
  # 允許手動執行
  workflow_dispatch:

  # 每小時自動執行的排程 (目前已註解關閉)
  # schedule:
  #   - cron: '0 * * * *' 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出代碼
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 安裝必要套件
        run: |
          python -m pip install --upgrade pip
          pip install pandas gspread google-auth lxml requests

      - name: 執行爬蟲腳本
        env:
          # 從 GitHub Secrets 讀取 Google 憑證內容
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
        run: |
          python github_crawler_script.py
